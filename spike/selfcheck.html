<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>M0 self-check</title>
<body style="font:13px ui-monospace,Consolas,monospace;padding:16px;background:#101014;color:#ddd">
<pre id="out">running…</pre>
<script>
(async () => {
  const uad = navigator.userAgentData;
  const info = {
    userAgent: navigator.userAgent,
    uaBrands: uad ? uad.brands.map((b) => `${b.brand}/${b.version}`) : null,
    uaPlatform: uad ? uad.platform : null,
    uaMobile: uad ? uad.mobile : null,
    highEntropy: uad && uad.getHighEntropyValues
      ? await uad.getHighEntropyValues(['architecture', 'bitness', 'fullVersionList', 'platformVersion'])
      : null,
    webdriver: navigator.webdriver,
    languages: navigator.languages,
    platform: navigator.platform,
    hardwareConcurrency: navigator.hardwareConcurrency,
    deviceMemory: navigator.deviceMemory ?? null,
    plugins: navigator.plugins ? navigator.plugins.length : -1,
    mimeTypes: navigator.mimeTypes ? navigator.mimeTypes.length : -1,
    hasChromeObj: typeof window.chrome !== 'undefined',
    maxTouchPoints: navigator.maxTouchPoints,
    pdfViewerEnabled: navigator.pdfViewerEnabled ?? null,
    prefersDark: matchMedia('(prefers-color-scheme: dark)').matches,
    screen: { w: screen.width, h: screen.height, dpr: devicePixelRatio },
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  };
  window.__selfcheck = info;
  document.getElementById('out').textContent = JSON.stringify(info, null, 2);
})();
</script>
</body>
</html>
