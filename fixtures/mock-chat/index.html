<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Mock DeepSeek Chat</title>
<!--
  M1 回归测试专用的本地 mock 站点（DD-10）。

  为什么需要它：真实的 chat.deepseek.com 需要登录，且绝不允许把真实账号放进自动化测试。
  所有针对"注入增强 / 会话镜像 / 导出 / 完成通知"的断言都打这个本地页面。

  它**不是**对真实站点 DOM 的复刻（真实选择器必须在登录后从真实页面单独提取，见 selectors.json）。
  它的职责是：用稳定的 data-testid 暴露"增强层需要识别的那几种结构"，并模拟流式回答。

  用法：
    node scripts/launch.mjs spike/main.mjs --url=file:///<abs>/fixtures/mock-chat/index.html
    路由：#/sign_in 登录页 · #/chat 会话页
-->
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; font: 14px/1.6 system-ui, "Segoe UI", sans-serif; }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 240px; border-right: 1px solid #8883; padding: 8px; overflow: auto; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #message-list { flex: 1; overflow: auto; padding: 12px; }
  .msg { padding: 8px 10px; margin: 6px 0; border-radius: 8px; max-width: 80%; }
  .user { background: #2b6cb0; color: #fff; margin-left: auto; }
  .assistant { background: #8882; }
  #composer { border-top: 1px solid #8883; padding: 8px; display: flex; gap: 8px; }
  textarea { flex: 1; min-height: 56px; resize: vertical; font: inherit; }
  .signin { margin: 60px auto; width: 320px; display: flex; flex-direction: column; gap: 10px; }
  .muted { opacity: .65; font-size: 12px; }
  .notice { display: block; margin-top: 6px; font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<div id="app"></div>

<script>
  const SITE = {
    conversations: [
      { id: 'c1', title: '关于 M0 可行性的讨论' },
      { id: 'c2', title: 'Electron 沙箱排查记录' },
    ],
  };
  let current = 'c1';
  const store = { c1: [], c2: [] };

  const app = document.getElementById('app');
  const route = () => location.hash || '#/sign_in';

  function renderSignIn() {
    app.innerHTML = `
      <div class="signin" data-testid="sign-in-view">
        <h2 style="margin:0">登录</h2>
        <input data-testid="login-phone-input" placeholder="手机号 / 邮箱" />
        <button data-testid="login-send-code">发送验证码</button>
        <input data-testid="login-code-input" placeholder="验证码" />
        <button data-testid="login-submit">登录</button>
        <div class="muted">这是本地 mock 页面，不会向任何服务器发送数据。</div>
      </div>`;
    app.querySelector('[data-testid="login-submit"]').onclick = () => { location.hash = '#/chat'; };
  }

  function renderChat() {
    app.innerHTML = `
      <div id="sidebar" data-testid="sidebar">
        <div class="muted" style="margin-bottom:6px">会话</div>
        <div data-testid="sidebar-conversation-list">
          ${SITE.conversations.map((c) =>
            `<div data-testid="conversation-item" data-conversation-id="${c.id}"
                  style="padding:6px 8px;border-radius:6px;cursor:pointer;${c.id === current ? 'background:#8883' : ''}">
               ${c.title}
             </div>`).join('')}
        </div>
      </div>
      <div id="main">
        <div style="padding:8px 12px;border-bottom:1px solid #8883;display:flex;gap:8px;align-items:center">
          <button data-testid="mode-switcher" data-mode="fast">快速模式</button>
          <button data-testid="mode-deep-think">深度思考</button>
          <button data-testid="mode-web-search">联网搜索</button>
        </div>
        <div id="message-list" data-testid="message-list"></div>
        <div id="composer">
          <textarea data-testid="composer-input" placeholder="给 DeepSeek 发送消息"></textarea>
          <button data-testid="composer-attach">附件</button>
          <button data-testid="composer-send">发送</button>
        </div>
      </div>`;

    app.querySelectorAll('[data-testid="conversation-item"]').forEach((el) => {
      el.onclick = () => { current = el.dataset.conversationId; renderChat(); };
    });
    app.querySelector('[data-testid="composer-send"]').onclick = send;
    paint();
  }

  function paint() {
    const list = app.querySelector('[data-testid="message-list"]');
    if (!list) return;
    list.innerHTML = store[current].map((m) => `
      <div class="msg ${m.role}" data-testid="message-${m.role}" data-message-id="${m.id}">
        ${m.reasoning ? `<div data-testid="reasoning-block">${escapeHtml(m.reasoning)}</div>` : ''}
        <div data-testid="message-body">${escapeHtml(m.text)}</div>
        ${m.role === 'assistant'
          ? '<span class="notice" data-testid="ai-generated-notice">内容由 AI 生成，请仔细甄别</span>'
          : ''}
      </div>`).join('');
    list.scrollTop = list.scrollHeight;
  }

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let seq = 0;
  function send() {
    const input = app.querySelector('[data-testid="composer-input"]');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    store[current].push({ id: 'm' + ++seq, role: 'user', text });
    const reply = { id: 'm' + ++seq, role: 'assistant', text: '', reasoning: '正在思考…' };
    store[current].push(reply);
    paint();

    // 模拟流式：先出现 generating-indicator，逐字追加，结束后移除（V9 用它判定"本轮结束"）
    const list = app.querySelector('[data-testid="message-list"]');
    const indicator = document.createElement('div');
    indicator.dataset.testid = 'generating-indicator';
    indicator.textContent = '正在生成…';
    list.appendChild(indicator);

    const full = '这是 mock 站点的流式回答。' + '（第 ' + seq + ' 轮）';
    let i = 0;
    const timer = setInterval(() => {
      reply.text += full[i++] ?? '';
      paint();
      list.appendChild(indicator);
      if (i >= full.length) {
        clearInterval(timer);
        reply.reasoning = '';
        indicator.remove();
        paint();
        document.dispatchEvent(new CustomEvent('mock:turn-finished', { detail: { id: reply.id } }));
      }
    }, 25);

    window.__mock = { get turns() { return seq; }, currentConversation: () => current };
  }

  // 自动化便利开关（不传参数时与手工浏览完全一致）：
  //   ?demo=1   预填两条消息（含 AI 生成标识与思考区块）→ 验证镜像/导出/标识检测（V11）
  //   ?stream=1 进入会话页后自动发一条消息 → 验证"本轮结束"判定与完成通知（V9）
  const params = new URLSearchParams(location.search);
  if (params.get('demo') === '1') {
    store.c1 = [
      { id: 'd1', role: 'user', text: '演示问题：帮我总结一下 M0 的结论。' },
      { id: 'd2', role: 'assistant', text: '演示回答：M0 自动化检查已通过，人工项待验证。', reasoning: '先看证据，再下结论。' },
    ];
    if (route() !== '#/chat') location.hash = '#/chat';
  }

  window.addEventListener('hashchange', () => (route() === '#/chat' ? renderChat() : renderSignIn()));
  route() === '#/chat' ? renderChat() : renderSignIn();

  if (params.get('stream') === '1') {
    setTimeout(() => {
      const input = app.querySelector('[data-testid="composer-input"]');
      if (input) {
        input.value = '自动流式测试';
        send();
      }
    }, 300);
  }
</script>
</body>
</html>
